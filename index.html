<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu người dùng GitHub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #f0f6fc;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #f0f6fc;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background-color: #238636;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }

        .result-card {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            animation: fadeIn 0.3s ease-in-out;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            margin-bottom: 15px;
        }

        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #f0f6fc;
        }

        .user-username {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 10px;
        }

        .user-bio {
            font-size: 14px;
            color: #c9d1d9;
            margin-bottom: 15px;
            font-style: italic;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background-color: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-weight: bold;
            color: #58a6ff;
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
        }

        .error-msg {
            color: #f85149;
            display: none;
            margin-top: 10px;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tra cứu người dùng GitHub</h2>
        <div class="search-box">
            <input type="text" id="usernameInput" placeholder="Nhập ID/Username (ví dụ: torvalds)" onkeypress="handleKeyPress(event)">
            <button onclick="searchUser()">Tìm</button>
        </div>

        <div class="error-msg" id="errorMsg">Không tìm thấy người dùng này!</div>

        <div class="result-card" id="resultCard">
            <img id="userAvatar" class="avatar" src="" alt="Avatar">
            <div class="user-name" id="userName">---</div>
            <div class="user-username" id="userLogin">@---</div>
            <div class="user-bio" id="userBio">Không có tiểu sử.</div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="repoCount">0</div>
                    <div class="stat-label">Repositories</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="followerCount">0</div>
                    <div class="stat-label">Followers</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function searchUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');

            if (!username) {
                alert("Vui lòng nhập ID người dùng!");
                return;
            }

            // Tắt báo lỗi và kết quả cũ
            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';

            try {
                // Gọi REST API công khai của GitHub
                const response = await fetch(`https://api.github.com/users/${username}`);  if (!response.ok) { throw new Error('User not found'); }  const data = await response.json();  // Cập nhật thông tin lên màn hình document.getElementById('userAvatar').src = data.avatar_url; document.getElementById('userName').textContent = data.name \vert{}\vert{} data.login; document.getElementById('userLogin').textContent = `@${data.login}`;
                document.getElementById('userBio').textContent = data.bio || 'Người dùng này chưa thêm tiểu sử.';
                document.getElementById('repoCount').textContent = data.public_repos;
                document.getElementById('followerCount').textContent = data.followers;

                // Hiển thị khung kết quả
                resultCard.style.display = 'block';

            } catch (error) {
                errorMsg.style.display = 'block';
            }
        }

        // Bấm phím Enter để tìm kiếm
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchUser();
            }
        }
    </script>
</body>
</html>
