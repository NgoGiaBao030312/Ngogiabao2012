<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Key Truy Cập</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2d2b42);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #0088cc;
            box-shadow: 0 0 8px rgba(0, 136, 204, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0088cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #006699;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Nhập Key Kích Hoạt</h2>
        <div class="input-group">
            <input type="text" id="keyInput" placeholder="Nhập Key của bạn..." autocomplete="off">
        </div>
        <button id="submitBtn" onclick="verifyKey()">Xác nhận Key</button>
        <div id="message"></div>
    </div>

    <script>
        // Token Bot Telegram của bạn
        const BOT_TOKEN = '8416102851:AAFH46P9tmATY5UF8f3T_xlbqJ5MVoyz_qk';

        async function verifyKey() {
            const keyInput = document.getElementById('keyInput').value.trim();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            if (!keyInput) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Vui lòng nhập Key!';
                return;
            }

            // Vô hiệu hóa nút và hiển thị trạng thái chờ
            submitBtn.disabled = true;
            messageDiv.className = '';
            messageDiv.innerText = 'Đang kiểm tra Key...';

            try {
                // Lấy danh sách tin nhắn từ Bot Telegram
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const data = await response.json();

                if (!data.ok) {
                    throw new Error('Không thể kết nối với Telegram API');
                }

                // Kiểm tra xem Key nhập vào có khớp với bất kỳ tin nhắn nào trong Telegram không
                const updates = data.result;
                let isValidKey = false;

                for (let update of updates) {
                    if (update.message && update.message.text) {
                        if (update.message.text.trim() === keyInput) {
                            isValidKey = true;
                            break;
                        }
                    }
                }

                if (isValidKey) {
                    messageDiv.className = 'success';
                    messageDiv.innerText = '✅ Key hợp lệ! Đã xác nhận thành công.';
                    // Thêm chuyển hướng hoặc hành động sau khi xác thực thành công tại đây
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerText = '❌ Key không đúng hoặc không tồn tại trên Telegram!';
                }

            } catch (error) {
                console.error(error);
                messageDiv.className = 'error';
                messageDiv.innerText = 'Lỗi kết nối kiểm tra Key!';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
