<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự Kiện Nhận Code Súng Free Fire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            text-align: center;
        }

        /* KHU VỰC 1: XÁC NHẬN ID */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                        url('https://ff.garena.com/static/images/bg.jpg') center/cover no-repeat;
        }

        .box-container {
            background: rgba(26, 29, 38, 0.95);
            border: 2px solid #ff9900;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
        }

        h1 {
            color: #ff9900;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
        }

        p.desc {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #090a0f;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff9900;
        }

        button.btn-confirm {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff9900, #ff5500);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 85, 0, 0.5);
        }

        /* Thẻ hiển thị thông tin nhân vật */
        .player-info {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            border-radius: 6px;
            color: #00ff66;
            font-size: 15px;
        }

        /* KHU VỰC 2: QUÀ TẶNG CODE SÚNG */
        .code-section {
            min-height: 100vh;
            padding: 50px 20px;
            background: #14161d;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-top: 30px;
        }

        .code-card {
            background: #1f232e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .code-card:hover {
            border-color: #ff9900;
        }

        .gun-title {
            color: #ffcc00;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .code-box {
            background: #000;
            color: #00ff66;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
            letter-spacing: 2px;
            margin: 10px 0;
            border: 1px dashed #00ff66;
        }

        .btn-copy {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-copy:hover {
            background: #ff9900;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- KHU VỰC 1: XÁC NHẬN ID PLAYER -->
    <div class="hero-section">
        <div class="box-container">
            <h1>Nhận Code Súng VIP</h1>
            <p class="desc">Nhập ID Free Fire để xác nhận thông tin nhân vật</p>
            
            <div class="input-group">
                <input type="text" id="playerID" placeholder="Nhập ID Free Fire (VD: 123456789)...">
            </div>

            <button class="btn-confirm" onclick="verifyAndRedirect()">Xác Nhận</button>

            <!-- Kết quả hiển thị tên -->
            <div class="player-info" id="playerInfo"></div>
        </div>
    </div>

    <!-- KHU VỰC 2: DANH SÁCH CODE SÚNG -->
    <div class="code-section" id="codeArea">
        <h1>Khu Vực Nhận Code Súng Free Fire</h1>
        <p class="desc">Mỗi code có thể nhập trực tiếp tại trang đổi quà của Garena</p>
