<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="bg-[#0f172a] text-white flex items-center justify-center min-h-screen font-sans p-4">
    <div class="container max-w-md mx-auto">
        
        <!-- CARD NHẬP KEY -->
        <div id="redeem-card" class="bg-[#1e293b] p-8 rounded-2xl shadow-2xl border border-slate-700 text-center">
            <div class="mb-4 inline-flex p-4 bg-amber-500/10 text-amber-400 rounded-full text-3xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-amber-400">KÍCH HOẠT KEY VIP</h2>
            <p class="text-slate-400 text-sm mb-6">Nhập mã Key của bạn để xác thực và nhận đường link tham gia nhóm Telegram VIP.</p>
            
            <form onsubmit="handleRedeem(event)" class="space-y-4">
                <div class="relative">
                    <input type="text" id="key-input" required placeholder="XXXX-XXXX-XXXX-XXXX" 
                           class="w-full px-4 py-3.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 uppercase tracking-widest text-center font-mono text-lg text-amber-300 placeholder-slate-600 shadow-inner">
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 font-bold rounded-xl hover:opacity-90 transition shadow-lg text-slate-950 flex items-center justify-center gap-2 text-base cursor-pointer">
                    <i class="fa-solid fa-shield-halved"></i> XÁC NHẬN KÍCH HOẠT
                </button>
            </form>
            <div id="error-msg" class="mt-4 text-red-400 text-sm hidden font-medium"></div>
        </div>

        <!-- CARD THÀNH CÔNG (HIỆN KHI NHẬP ĐÚNG KEY) -->
        <div id="success-card" class="bg-[#1e293b] p-8 rounded-2xl shadow-2xl border border-slate-700 text-center hidden space-y-4">
            <div class="inline-flex p-4 bg-green-500/10 text-green-400 rounded-full text-4xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-green-400">KÍCH HOẠT THÀNH CÔNG!</h2>
            <p class="text-slate-300 text-sm">Mã key hợp lệ. Bấm vào nút bên dưới để tham gia nhóm Telegram ngay bây giờ.</p>
            
            <div class="pt-2">
                <!-- Thay link bên dưới bằng link nhóm Telegram VIP thực tế của bạn -->
                <a id="telegram-link" href="https://t.me/" target="_blank" class="block w-full py-3.5 bg-sky-500 hover:bg-sky-400 font-bold rounded-xl text-white transition shadow-lg text-center flex items-center justify-center gap-2 text-base">
                    <i class="fa-brands fa-telegram text-2xl"></i> VÀO NHÓM TELEGRAM VIP
                </a>
            </div>
            <div class="pt-2">
                <button onclick="resetForm()" class="text-slate-400 hover:text-white text-xs underline cursor-pointer">
                    ← Nhập mã key khác
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    const input = document.getElementById('key-input');
    
    // Tự động định dạng XXXX-XXXX-XXXX-XXXX khi gõ
    input.addEventListener('input', function (e) {
        let value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        let parts = [];
        for (let i = 0; i < value.length && i < 16; i += 4) {
            parts.push(value.substring(i, i + 4));
        }
        e.target.value = parts.join('-');
    });

    function handleRedeem(event) {
        event.preventDefault();
        const keyValue = input.value.trim();
        const errorMsg = document.getElementById('error-msg');

        if (keyValue.length < 19) {
            errorMsg.textContent = "❌ Mã Key phải đủ 16 ký tự (VD: TJWC-ZT1N-EEN8-S1LQ)!";
            errorMsg.classList.remove('hidden');
            return;
        }

        errorMsg.classList.add('hidden');
        document.getElementById('redeem-card').classList.add('hidden');
        document.getElementById('success-card').classList.remove('hidden');
    }

    function resetForm() {
        input.value = '';
        document.getElementById('success-card').classList.add('hidden');
        document.getElementById('redeem-card').classList.remove('hidden');
    }
</script>
