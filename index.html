<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu ID & Tên Người Chơi Free Fire</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #ffb703;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #ccc;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 8px rgba(255, 183, 3, 0.8);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ffb703;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #fb8500;
            color: #fff;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            word-break: break-word;
        }

        .result-box.active {
            display: block;
        }

        .status-loading {
            color: #ffb703;
        }

        .status-error {
            color: #ff4d4d;
        }

        .status-success {
            color: #00f5d4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Tra Cứu Free Fire</h2>
    
    <div class="input-group">
        <label for="userInput">Nhập ID hoặc Tên người chơi:</label>
        <input type="text" id="userInput" placeholder="VD: 123456789 hoặc tên Game...">
    </div>

    <div class="btn-group">
        <button onclick="searchPlayer()">Tra Cứu</button>
    </div>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Hàm lưu dữ liệu vào localStorage để phục vụ việc tìm ID từ Tên
    function saveToHistory(id, name) {
        let history = JSON.parse(localStorage.getItem('ff_player_db')) || {};
        history[name.toLowerCase()] = id; // Lưu tên dưới dạng chữ thường để dễ tìm kiếm
        localStorage.setItem('ff_player_db', JSON.stringify(history));
    }

    // Hàm lấy ID từ Tên lưu trong localStorage
    function getIdByName(name) {
        let history = JSON.parse(localStorage.getItem('ff_player_db')) || {};
        return history[name.toLowerCase()] || null;
    }

    async function searchPlayer() {
        const inputVal = document.getElementById('userInput').value.trim();
        const resultBox = document.getElementById('resultBox');

        if (!inputVal) {
            resultBox.className = "result-box active status-error";
            resultBox.innerHTML = "Vui lòng nhập ID hoặc Tên người chơi!";
            return;
        }

        resultBox.className = "result-box active status-loading";
        resultBox.innerHTML = "Đang tra cứu dữ liệu...";

        // Kiểm tra xem đầu vào là ID (số) hay Tên (chuỗi)
        const isNumeric = /^\d+$/.test(inputVal);

        if (isNumeric) {
            // Trường hợp 1: Nhập ID -> Tìm Tên qua API
            try {
                // API Free Fire công khai kiểm tra Nickname theo ID (Region VN)
                const response = await fetch(`https://region-vn.garena.com/api/game/ff/player_info?app_id=100067&role_id=${inputVal}`);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.nickname) {
                        const nickname = data.nickname;
                        saveToHistory(inputVal, nickname); // Lưu lại vào bộ nhớ
                        
                        resultBox.className = "result-box active status-success";
                        resultBox.innerHTML = `
                            <p><strong>ID:</strong> ${inputVal}</p>
                            <p><strong>Tên nhân vật:</strong> <span style="color: #ffb703;">${nickname}</span></p>
                        `;
                    } else {
                        resultBox.className = "result-box active status-error";
                        resultBox.innerHTML = "Không tìm thấy người chơi với ID này!";
                    }
                } else {
                    // Mẹo dự phòng (Backup API) nếu API trên bận
                    fetchBackupApi(inputVal);
                }
            } catch (err) {
                fetchBackupApi(inputVal);
            }
        } else {
            // Trường hợp 2: Nhập Tên -> Tìm ID từ cơ sở dữ liệu đã lưu
            const foundId = getIdByName(inputVal);
            if (foundId) {
                resultBox.className = "result-box active status-success";
                resultBox.innerHTML = `
                    <p><strong>Tên nhân vật:</strong> ${inputVal}</p>
                    <p><strong>ID Tìm Được:</strong> <span style="color: #ffb703;">${foundId}</span></p>
                    <small style="color: #aaa; font-size: 11px;">(Dữ liệu từ lịch sử tra cứu trên máy)</small>
                `;
            } else {
                resultBox.className = "result-box active status-error";
                resultBox.innerHTML = "Chưa có dữ liệu ID cho tên này! Vui lòng tra cứu bằng **ID** ít nhất 1 lần để hệ thống ghi nhớ.";
            }
        }
    }

    // API dự phòng tra cứu ID
    async function fetchBackupApi(id) {
        const resultBox = document.getElementById('resultBox');
        try {
            const res = await fetch(`https://free-fire-api-five.vercel.app/api/id?id=${id}`);
            const data = await res.json();
            if (data && data.nickname) {
                saveToHistory(id, data.nickname);
                resultBox.className = "result-box active status-success";
                resultBox.innerHTML = `
                    <p><strong>ID:</strong> ${id}</p>
                    <p><strong>Tên nhân vật:</strong> <span style="color: #ffb703;">${data.nickname}</span></p>
                `;
            } else {
                resultBox.className = "result-box active status-error";
                resultBox.innerHTML = "Không tìm thấy người chơi hoặc API bị lỗi!";
            }
        } catch (e) {
            resultBox.className = "result-box active status-error";
            resultBox.innerHTML = "Lỗi kết nối máy chủ tra cứu!";
        }
    }
</script>

</body>
</html>
